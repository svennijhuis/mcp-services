name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore McpServices.slnx

      - name: Build
        run: dotnet build McpServices.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test McpServices.slnx --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Pack tools
        run: dotnet pack McpServices.slnx --no-build --configuration Release --output nupkg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
